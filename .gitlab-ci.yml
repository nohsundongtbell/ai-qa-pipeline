# GitLab CI 버전 (.github/workflows/test.yml과 같은 흐름)
#  - main push 또는 Merge Request 생성 시 실행
#  - Playwright가 테스트 서버를 직접 띄우므로 별도 서버 단계는 없음
#  - HTML 리포트와 실패 시 trace/스크린샷을 artifact로 저장
#  - 결과를 Slack으로 보내고, 실패한 TC는 Jira 이슈로 등록 (scripts/report.js)
#
# 필요한 CI/CD 변수 (Settings > CI/CD > Variables, Masked 권장):
#   SLACK_WEBHOOK_URL, JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN, JIRA_PROJECT_KEY

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test

playwright:
  stage: test
  image: node:24
  timeout: 15 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
  script:
    - npx playwright test
  after_script:
    # 테스트가 실패해도 실행된다 (after_script는 항상 실행됨)
    - node scripts/report.js
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: junit.xml
