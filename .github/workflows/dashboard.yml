name: Metrics Dashboard

# 지표 대시보드를 GitHub Pages 로 공개한다.
#  - "Playwright Tests" 가 main 에서 끝나면(metrics job 이 history.jsonl 을 갱신한 뒤) 다시 만든다.
#  - dashboard/ 나 이 스크립트가 바뀌어도, 수동 실행으로도 만든다.
# 한 번만 필요한 설정: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꾼다.
on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["dashboard/**", "scripts/build-dashboard.js", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 테스트가 취소된 실행으로는 다시 만들지 않는다 (실패한 실행은 이력에 남아 있으므로 만든다)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 이력은 metrics-data 브랜치에 있다. 아직 없으면(첫 실행 전) 빈 대시보드가 만들어진다.
      - name: 지표 이력 내려받기
        run: |
          mkdir -p metrics
          if git fetch --depth 1 origin metrics-data 2>/dev/null; then
            git show FETCH_HEAD:history.jsonl > metrics/history.jsonl
          else
            echo "metrics-data 브랜치가 아직 없습니다."
          fi

      - name: 대시보드 만들기
        run: node scripts/build-dashboard.js --history metrics/history.jsonl --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
