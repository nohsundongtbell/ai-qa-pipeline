<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="toolbar">
      <h1>게시글 목록</h1>
      <a id="write-link" class="btn" href="/write.html" hidden>글쓰기</a>
    </div>
    <div id="message"></div>
    <table>
      <thead>
        <tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th></tr>
      </thead>
      <tbody id="post-list"></tbody>
    </table>
    <div id="pagination" class="pagination" aria-label="페이지 이동"></div>
  </main>
  <script src="/app.js"></script>
  <script>
    const LIMIT = 10;

    async function load(page) {
      const { ok, data } = await api('GET', `/api/posts?page=${page}&limit=${LIMIT}`);
      const tbody = document.getElementById('post-list');
      tbody.textContent = '';
      if (!ok) return showMessage('목록을 불러오지 못했습니다.', true);

      if (data.posts.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4;
        td.textContent = '게시글이 없습니다.';
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
      for (const p of data.posts) {
        const tr = document.createElement('tr');
        const idTd = document.createElement('td');
        idTd.textContent = p.id;
        const titleTd = document.createElement('td');
        const a = document.createElement('a');
        a.href = `/post.html?id=${p.id}`;
        a.textContent = p.title;
        titleTd.appendChild(a);
        const authorTd = document.createElement('td');
        authorTd.textContent = p.author;
        const dateTd = document.createElement('td');
        dateTd.textContent = p.created_at;
        tr.append(idTd, titleTd, authorTd, dateTd);
        tbody.appendChild(tr);
      }
      renderPagination(data.page, data.totalPages);
    }

    function renderPagination(current, total) {
      const box = document.getElementById('pagination');
      box.textContent = '';
      const make = (label, page, opts = {}) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        if (opts.current) { b.className = 'current'; b.setAttribute('aria-current', 'page'); }
        if (opts.disabled) b.disabled = true;
        b.addEventListener('click', () => { history.replaceState(null, '', `?page=${page}`); load(page); });
        box.appendChild(b);
      };
      make('이전', current - 1, { disabled: current <= 1 });
      for (let i = 1; i <= total; i++) make(String(i), i, { current: i === current });
      make('다음', current + 1, { disabled: current >= total });
    }

    (async () => {
      const user = await renderNav();
      document.getElementById('write-link').hidden = !user;
      const page = Math.max(parseInt(getParam('page'), 10) || 1, 1);
      load(page);
    })();
  </script>
</body>
</html>
