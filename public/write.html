<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글쓰기 - 게시판</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1 id="heading">글쓰기</h1>
    <div id="message"></div>
    <form id="form">
      <label for="title">제목</label>
      <input type="text" id="title" name="title" maxlength="100">
      <label for="content">내용</label>
      <textarea id="content" name="content"></textarea>
      <div class="actions">
        <button type="submit" id="submit-btn">등록</button>
        <a class="btn secondary" href="/">취소</a>
      </div>
    </form>
  </main>
  <script src="/app.js"></script>
  <script>
    const editId = getParam('id');

    (async () => {
      const user = await renderNav();
      if (!user) {
        location.href = '/login.html';
        return;
      }
      if (editId) {
        document.getElementById('heading').textContent = '글 수정';
        document.getElementById('submit-btn').textContent = '수정';
        document.title = '글 수정 - 게시판';
        const { ok, status, data } = await api('GET', `/api/posts/${editId}`);
        if (!ok) return showMessage(status === 404 ? '게시글을 찾을 수 없습니다.' : '불러오지 못했습니다.', true);
        if (data.user_id !== user.id) return showMessage('본인의 글만 수정할 수 있습니다.', true);
        document.getElementById('title').value = data.title;
        document.getElementById('content').value = data.content;
      }
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
      };
      const { ok, status, data } = editId
        ? await api('PUT', `/api/posts/${editId}`, body)
        : await api('POST', '/api/posts', body);
      if (status === 401) { location.href = '/login.html'; return; }
      if (!ok) return showMessage(data ? data.error : '저장에 실패했습니다.', true);
      location.href = `/post.html?id=${data.id}`;
    });
  </script>
</body>
</html>
